<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>个人终端 · 示例设备</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f3; color: #182a24; }
    main { width: min(100% - 40px, 420px); margin: max(36px, env(safe-area-inset-top)) auto 32px; }
    header { border-bottom: 1px solid #d3ddd6; padding-bottom: 24px; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 8px; background: #176a54; color: #fff; font-size: 24px; }
    h1 { margin: 24px 0 6px; font-size: 25px; font-weight: 700; }
    .subtitle { margin: 0; color: #61716a; font-size: 14px; }
    .demo-note { margin: 24px 0 0; padding: 12px 14px; border-left: 3px solid #b46c35; background: #fff5e8; color: #714523; font-size: 14px; }
    .fields { padding-top: 26px; }
    label { display: block; margin-bottom: 10px; font-size: 15px; font-weight: 600; }
    input[type="password"], input[type="text"] { width: 100%; height: 54px; border: 1px solid #9daea4; border-radius: 6px; background: #fff; padding: 0 16px; color: #182a24; font-size: 17px; }
    input:focus, button:focus-visible, a:focus-visible { outline: 2px solid #176a54; outline-offset: 2px; }
    .reveal { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: #53645b; font-size: 14px; font-weight: 400; }
    .reveal input { width: 18px; height: 18px; }
    .clear { margin-top: 12px; border: 0; background: none; color: #176a54; font-size: 14px; padding: 8px 0; }
    .action { position: relative; overflow: hidden; width: 100%; height: 76px; margin-top: 20px; border: 0; border-radius: 6px; background: #176a54; color: #fff; font-size: 20px; font-weight: 700; touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .15s ease-out; }
    .action.armed { transform: scale(.94); background: #10523f; }
    .action.complete { animation: button-pop .42s ease-out; }
    .action.success { background: #2a9f78; }
    .action-label { position: relative; z-index: 1; }
    .hold-wave { position: absolute; left: 50%; top: 50%; width: 140%; aspect-ratio: 1; border-radius: 50%; background: #2a9f78; transform: translate(-50%, -50%) scale(0); pointer-events: none; }
    @keyframes button-pop { 0% { transform: scale(.94); } 45% { transform: scale(1.07); } 75% { transform: scale(.985); } 100% { transform: scale(1); } }
    #status { min-height: 26px; margin: 18px 0 0; color: #53645b; font-size: 15px; }
    #status.error { color: #ab3830; }
    .back { display: inline-block; margin-top: 26px; color: #176a54; text-decoration: none; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <header><div class="mark" aria-hidden="true">⌂</div><h1>个人终端</h1><p class="subtitle">示例设备</p></header>
    <p class="demo-note">演示模式，不连接或控制真实设备。示例密码：demo1234</p>
    <div class="fields">
      <label for="password">开锁密码</label>
      <input id="password" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24" placeholder="输入示例密码 demo1234">
      <label class="reveal"><input id="reveal" type="checkbox">显示密码</label>
      <button id="clear" class="clear" type="button">清除输入</button>
      <button id="unlock" class="action" type="button"><span id="hold-wave" class="hold-wave" aria-hidden="true"></span><span id="action-label" class="action-label">长按开锁</span></button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <a class="back" href="index.html?manual=1">返回设备连接</a>
  </main>
  <script>
    const password = document.querySelector('#password');
    const button = document.querySelector('#unlock');
    const actionLabel = document.querySelector('#action-label');
    const holdWave = document.querySelector('#hold-wave');
    const status = document.querySelector('#status');
    const holdMs = 500;
    let holdFrame = 0;
    let holdStart = 0;
    let activePointer = null;
    let busy = false;
    document.querySelector('#reveal').addEventListener('change', event => {
      password.type = event.target.checked ? 'text' : 'password';
    });
    document.querySelector('#clear').addEventListener('click', () => {
      password.value = '';
      message('已清除输入');
    });
    function message(text, error = false) {
      status.textContent = text;
      status.classList.toggle('error', error);
    }
    function cancelHold() {
      cancelAnimationFrame(holdFrame);
      holdFrame = 0;
      activePointer = null;
      button.classList.remove('armed');
      holdWave.style.transform = 'translate(-50%, -50%) scale(0)';
      if (!busy) actionLabel.textContent = '长按开锁';
    }
    function completeHold() {
      // 长按完成后先保留填充圆，等回弹结束再复位，避免请求状态打断动画。
      cancelAnimationFrame(holdFrame);
      holdFrame = 0;
      activePointer = null;
      button.classList.remove('armed');
      holdWave.style.transform = 'translate(-50%, -50%) scale(1)';
      button.classList.add('success');
      button.classList.add('complete');
      setTimeout(() => {
        button.classList.remove('complete');
        holdWave.style.transform = 'translate(-50%, -50%) scale(0)';
      }, 420);
      unlock();
    }
    function updateHold(now) {
      if (activePointer === null) return;
      const progress = Math.min(1, (now - holdStart) / holdMs);
      holdWave.style.transform = `translate(-50%, -50%) scale(${progress})`;
      if (progress >= 1) {
        completeHold();
      } else {
        holdFrame = requestAnimationFrame(updateHold);
      }
    }
    function unlock() {
      busy = true;
      button.disabled = true;
      actionLabel.textContent = '正在开锁';
      message('已接受请求 · 正在开锁');
      // 只更新演示状态；这里没有 fetch，也不会触发真实舵机。
      setTimeout(() => message('已开锁 · 等待回锁'), 1800);
      setTimeout(() => message('正在回锁'), 4800);
      setTimeout(() => {
        message('已回锁 · 演示完成');
        busy = false;
        button.disabled = false;
        actionLabel.textContent = '长按开锁';
      }, 6400);
    }
    button.addEventListener('pointerdown', event => {
      if (busy || activePointer !== null || button.classList.contains('complete') || event.button !== 0) return;
      button.classList.remove('success');
      // 密码在按下时判定；错误输入不启动长按，也不会在延迟后开锁。
      if (password.value !== 'demo1234') {
        message('示例密码不正确', true);
        return;
      }
      cancelHold();
      message('');
      activePointer = event.pointerId;
      button.setPointerCapture(event.pointerId);
      button.classList.add('armed');
      actionLabel.textContent = '正在确认';
      holdStart = performance.now();
      holdFrame = requestAnimationFrame(updateHold);
    });
    for (const name of ['pointerup', 'pointercancel', 'lostpointercapture'])
      button.addEventListener(name, event => {
        if (event.pointerId === activePointer) cancelHold();
      });
    button.addEventListener('pointermove', event => {
      if (event.pointerId !== activePointer) return;
      const bounds = button.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right ||
          event.clientY < bounds.top || event.clientY > bounds.bottom) cancelHold();
    });
  </script>
</body>
</html>
